60px 66px 54px;margin:0 auto 22px;box-shadow:0 10px 38px #18375617;position:relative;display:flex;flex-direction:column;border:1px solid #e2e7ed;page-break-after:always}.paper.cover{justify-content:space-between;background:linear-gradient(150deg,#fff 50%,#f2f6fa)}.paper.cover h1{font-size:40px;line-height:1.12;color:#153b63;max-width:620px;margin:14px 0}.paper.cover .doc-title-label{font-size:13px;letter-spacing:.18em;color:#74879a;text-transform:uppercase}.paper .doc-footer{margin-top:auto;border-top:1px solid #d7dfe8;padding-top:9px;display:flex;justify-content:space-between;gap:12px;color:#61758a;font-size:10px}.paper h2{font-size:22px;color:#193b60;margin:0 0 16px;padding-bottom:10px;border-bottom:1px solid #dbe4ed}.paper h3{font-size:15px;color:#243d58;margin:17px 0 6px}.paper .doc-body{white-space:pre-wrap;font-size:13px;color:#26384b;line-height:1.75;flex:1}.paper .revbar{position:absolute;left:30px;top:130px;width:4px;height:55px;background:#141b24;border-radius:2px}.paper .rev-note{position:absolute;left:42px;top:129px;font-size:9px;color:#758497}.paper.control{min-height:730px}.paper table{border-collapse:collapse;width:100%;font-size:11px}.paper th,.paper td{border:1px solid #cfd9e4;text-align:left;padding:8px}.paper th{background:#f0f4f8;color:#33516e}.paper.toc-list{margin:0;padding:0;list-style:none}.paper .toc-row{display:flex;gap:9px;padding:8px 0;border-bottom:1px dotted #b8c4d0;font-size:12px}.paper .toc-row span:first-child{color:#315776}.paper .toc-row .leader{flex:1;border-bottom:1px dotted #aab6c3;transform:translateY(-5px)}.paper .toc-row em{font-style:normal;font-weight:700;color:#254c71}.modal-backdrop{display:none;position:fixed;inset:0;background:#0e233dcc;z-index:10;align-items:center;justify-content:center;padding:20px}.modal-backdrop.show{display:flex}.modal{background:white;border-radius:12px;width:min(550px,100%);padding:22px;box-shadow:0 24px 80px #07142655}.modal h2{font-size:17px;margin:0 0 15px}.modal-foot{display:flex;justify-con @media(max-width:1000px){.app{grid-template-columns:215px 1fr}.content{padding:24px}.workarea{grid-template-columns:240px 1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.app{display:block}.sidebar{position:fixed;z-index:8;inset:0 auto 0 0;width:265px;transform:translateX(-100%);transition:.22s;box-shadow:15px 0 35px #102d5030}.sidebar.open{transform:none}.mobile-menu{display:inline-flex}.topbar{padding:0 14px;height:60px}.topbar .actions{gap:5px}.topbar .btn{padding:7px 9px}.save-state{display:none}.content{padding:20px 14px 40px}.pagehead{align-items:flex-start;flex-direction:column}.pagehead h1{font-size:23px}.stats{gap:9px}.card{padding:14px}.stat-value{font-size:23px}.overview-grid,.settings-grid{grid-template-columns:1fr}.workarea{grid-template-columns:1fr}.workarea aside .panel-body{max-height:200px;overflow:auto}.fields-two{grid-template-columns:1fr}.editor-head{align-items:stretch;flex-direction:column}.paper{min-height:820px;padding:42px 30px}.paper .revbar{left:12px}.paper .rev-note{left:22px}.actions .optional{display:none}}

<body>
<div class="app" id="app">
<aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-icon">OM</div><div><strong>Operations Manual<br>Studio</strong><span>Document control workspace</span></div></div><div><div class="navlabel">Workspace</div><nav class="nav" id="nav">
<button class="active" data-view="overview"><span class="ico">▦</span>Overview</button><button data-view="editor"><span class="ico">▤</span>Manual editor</button><button data-view="control"><span class="ico">▧</span>Control page</button><button data-view="toc"><span class="ico">☷</span>Table of contents</button><button data-view="settings"><span class="ico">⚙</span>Document settings</button></nav></div><div class="side-bottom"><b id="sideDoc">Operations Manual</b><span id="sideVersion">Revision 00 · Draft</span></div></aside>
<main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:11px"><button class="btn mobile-menu" id="menuBtn">☰</button><div class="crumb">Manual library&nbsp; / &nbsp;<b id="crumbText">Overview</b></div></div><div class="actions"><span class="save-state" id="saveState">● Saved locally</span><button class="btn optional" id="backupBtn">⇩ Backup</button><button class="btn" id="printBtn">Print / PDF</button></div></header>
<div class="content" id="content"></div><div class="doc-shell" id="docShell"></div></main></div>
<div class="modal-backdrop" id="modal"><div class="modal"><h2 id="modalTitle">Add a chapter</h2><div id="modalBody"></div><div class="modal-foot"><button class="btn" id="modalCancel">Cancel</button><button class="btn primary" id="modalSave">Add chapter</button></div></div></div><div class="toast" id="toast"></div><input type="file" id="fileInput" accept="application/json" hidden>
<script>
const KEY='om-studio-v1';const parts=['A','B','C','D'];const names={A:'General / Basic',B:'Aircraft Operating Matters',C:'Route and Aerodrome Instructions',D:'Training'};
const fresh=()=>({title:'Operations Manual',company:'PT. Transwisata Prima Aviation',documentCode:'TWA-OM',revision:'00',effectiveDate:new Date().toISOString().slice(0,10),preparedBy:'Flight Operations Department',approvedBy:'Accountable Manager',footerTemplate:'{company}  |  {code}  |  Rev. {revision}  |  Page {page}',numberTemplate:'OM-{part}-{chapter}.{page}',sectionTemplate:'1.{index}',showFooter:true,chapters:parts.map((p,i)=>({id:p,part:p,title:names[p],items:[]})),activePart:'A',activeItem:null});
let data;try{data=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{data=fresh()}let view='overview',selectedItem=null,modalKind='';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const chapter=()=>data.chapters.find(c=>c.id===data.activePart)||data.chapters[0];const allItems=()=>data.chapters.flatMap(c=>c.items.map(x=>({...x,part:c.part,partTitle:c.title})));const totalPages=()=>1+1+1+allItems().length;let saveTimer;
function save(){clearTimeout(saveTimer);$('#saveState').textContent='● Saving…';saveTimer=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(data));$('#saveState').textContent='● Saved locally';$('#sideDoc').textContent=data.title||'Operations Manual';$('#sideVersion').textContent=`Revision ${data.revision||'00'} · Draft`}catch{$('#saveState').textContent='● Storage full — export a backup'}} ,180)}
function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}function setView(v){view=v;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));$('#crumbText').textContent=({overview:'Overview',editor:'Manual editor',control:'Control page',toc:'Table of contents',settings:'Document settings'})[v];$('#docShell').style.display='none';$('#content').style.display='block';render();$('#sidebar').classList.remove('open')}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-view]');if(b)setView(b.dataset.view)});$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');$('#printBtn').onclick=()=>{renderDocument();window.print()};$('#backupBtn').onclick=backup;
function render(){if(view==='overview')renderOverview();if(view==='editor')renderEditor();if(view==='control')renderControl();if(view==='toc')renderToc();if(view==='settings')renderSettings()}
function head(kicker,title,desc,action=''){return `<div class="pagehead"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function renderOverview(){let items=allItems();$('#content').innerHTML=head('DOCUMENT CONTROL','Manual library',`Manage the controlled pages in ${esc(data.title)}. Changes save automatically on this device.`)+`<div class="grid stats"><div class="card"><div class="stat-label">MANUAL PARTS</div><div class="stat-value">${data.chapters.length}</div><div class="stat-note">Operation A through D</div></div><div class="card"><div class="stat-label">CONTENT PAGES</div><div class="stat-value">${items.length}</div><div class="stat-note">Across all manual parts</div></div><div class="card"><div class="stat-label">REVISED PAGES</div><div class="stat-value">${items.filter(x=>x.revised).length}</div><div class="stat-note">Revision bars enabled</div></div><div class="card"><div class="stat-label">CURRENT REVISION</div><div class="stat-value">${esc(data.revision||'00')}</div><div class="stat-note">Effective ${esc(data.effectiveDate||'—')}</div></div></div><div class="grid overview-grid"><section class="card"><div class="section-card-head"><h2>Manual parts</h2><span class="subtle">${items.length} content pages</span></div><div class="part-list">${data.chapters.map(c=>`<div class="part-row"><div class="part-mark">${esc(c.part)}</div><div class="part-copy"><strong>Part ${esc(c.part)} · ${esc(c.title)}</strong><span>${c.items.length} ${c.items.length===1?'page':'pages'}</span></div><button class="btn" data-openpart="${esc(c.id)}">Open</button></div>`).join('')}</div></section><section class="card"><div class="section-card-head"><h2>Document details</h2><button class="btn" data-go="settings">Edit</button></div><div class="activity"><div class="activity-item"><span class="dot"></span><div><b>${esc(data.documentCode)}</b><br>Document reference</div></div><div class="activity-item"><span class="dot"></span><div><b>${esc(data.company)}</b><br>Issuing organisation</div></div><div class="activity-item"><span class="dot"></span><div><b>${esc(data.preparedBy||'—')}</b><br>Prepared by</div></div><div class="activity-item"><span class="dot"></span><div><b>${esc(data.approvedBy||'—')}</b><br>Approved by</div></div></div><div class="divider"></div><div class="muted-box">Use <b>Print / PDF</b> to generate a paginated manual containing the cover, control page, automatic contents, and all saved pages.</div></section></div>`;$('#content').querySelectorAll('[data-openpart]').forEach(b=>b.onclick=()=>{data.activePart=b.dataset.openpart;setView('editor')});$('#content').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setView(b.dataset.go))}
function renderEditor(){let c=chapter();if(!selectedItem||!c.items.some(x=>x.id===selectedItem))selectedItem=c.items[0]?.id||null;let item=c.items.find(x=>x.id===selectedItem);let action='<button class="btn primary" id="addChapter">＋ Add page</button>';$('#content').innerHTML=head('CONTROLLED DOCUMENT','Manual editor','Organise the manual into parts and maintain each page.',action)+`<div class="workarea"><aside class="panel"><div class="panel-head"><h2>Manual parts</h2></div><div class="panel-body"><div class="chapter-list">${data.chapters.map(x=>`<div class="chapter-item ${x.id===c.id?'active':''}" data-part="${esc(x.id)}"><div><b>Part ${esc(x.part)}</b><span>${esc(x.title)}</span></div><small>${x.items.length}</small></div>`).join('')}</div><div class="divider"></div><div class="panel-head" style="padding:0 0 10px;border:0"><h2>Pages in Part ${esc(c.part)}</h2><button class="iconbtn" id="addPageSmall" title="Add page">＋</button></div><div class="chapter-list">${c.items.length?c.items.map((x,i)=>`<div class="chapter-item ${item?.id===x.id?'active':''}" data-item="${esc(x.id)}"><div><b>${esc(x.number||`${i+1}`)} &nbsp; ${esc(x.title||'Untitled page')}</b><span>${x.revised?'Revision bar on':'Current page'}</span></div></div>`).join(''):'<div class="subtle" style="padding:8px">No pages yet. Add the first page.</div>'}</div></div></aside><section class="panel"><div class="panel-head"><h2>${item?'Edit manual page':'Create a manual page'}</h2><span class="badge">Part ${esc(c.part)}</span></div><div class="panel-body">${item?`<div class="editor-head"><div class="field" style="margin:0"><label>Page title</label><input id="itemTitle" value="${esc(item.title)}" placeholder="e.g. 1.1 Purpose"></div><div class="field" style="margin:0;max-width:170px"><label>Section number</label><input id="itemNumber" value="${esc(item.number)}" placeholder="1.1"></div></div><div class="field"><label>Page content</label><textarea id="itemBody" placeholder="Enter the text for this manual page. Use blank lines to separate paragraphs.">${esc(item.body)}</textarea><small>Each entry produces a controlled page in the generated manual. Use plain text; paragraph breaks are preserved.</small></div><div class="editor-actions"><div class="inline"><label class="toggle"><input id="itemRevised" type="checkbox" ${item.revised?'checked':''}> Show black revision bar</label><span class="subtle">Page ${esc(item.number||'—')}</span></div><div class="inline"><button class="btn danger" id="deletePage">Delete page</button><button class="btn primary" id="savePage">Save page</button></div></div>`:`<div class="empty">Select a page or add one to start editing this manual part.</div>`}</div></section></div>`;
$('#content').querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>{data.activePart=b.dataset.part;selectedItem=null;save();renderEditor()});$('#content').querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{selectedItem=b.dataset.item;renderEditor()});$('#addChapter').onclick=()=>openAdd();$('#addPageSmall').onclick=()=>openAdd();if(item){$('#savePage').onclick=()=>{item.title=$('#itemTitle').value.trim()||'Untitled page';item.number=$('#itemNumber').value.trim();item.body=$('#itemBody').value;item.revised=$('#itemRevised').checked;save();renderEditor();toast('Page saved')};$('#deletePage').onclick=()=>{if(confirm('Delete this page from the manual?')){c.items=c.items.filter(x=>x.id!==item.id);selectedItem=c.items[0]?.id||null;save();renderEditor();toast('Page deleted')}}}}
function suggestedSection(c){let tmpl=data.sectionTemplate||'1.{index}',index=c.items.length+1;return tmpl.replaceAll('{part}',c.part).replaceAll('{chapter}','1').replaceAll('{index}',String(index))}function openAdd(){modalKind='page';let c=chapter();$('#modalTitle').textContent=`Add a page to Part ${c.part}`;$('#modalSave').textContent='Add page';$('#modalBody').innerHTML=`<div class="field"><label>Page title</label><input id="newTitle" placeholder="e.g. Purpose"></div><div class="field"><label>Section number</label><input id="newNumber" value="${esc(suggestedSection(c))}"></div><div class="field"><label>Page content</label><textarea id="newBody" placeholder="Enter the content for this manual page."></textarea></div><label class="toggle"><input type="checkbox" id="newRevised"> Mark this as a revised page</label>`;$('#modal').classList.add('show');setTimeout(()=>$('#newTitle').focus(),30)}$('#modalCancel').onclick=()=>$('#modal').classList.remove('show');$('#modalSave').onclick=()=>{if(modalKind==='page'){let c=chapter(),x={id:crypto.randomUUID?.()||String(Date.now()),title:$('#newTitle').value.trim()||'Untitled page',number:$('#newNumber').value.trim(),body:$('#newBody').value,revised:$('#newRevised').checked};c.items.push(x);selectedItem=x.id;save();$('#modal').classList.remove('show');renderEditor();toast('Page added')}};
function bindSettings(){document.querySelectorAll('[data-bind]').forEach(el=>{let event=el.type==='checkbox'?'change':'input';el.addEventListener(event,()=>{data[el.dataset.bind]=el.type==='checkbox'?el.checked:el.value;save();if(view==='settings'){$('#coverPreview').innerHTML=coverPreview();$('#formatPreview').textContent=`${formatNum('A','1.1',4)} · ${makeFooter(4,formatNum('A','1.1',4))}`}})})}
function renderControl(){let action='<button class="btn" id="controlPrint">Preview / Print manual</button>';$('#content').innerHTML=head('DOCUMENT GOVERNANCE','Control page','Set the document identity, revision status, and approval information.',action)+`<div class="notice">The control page is generated automatically in the print output. Update the fields here; the table of contents and footer use the same document settings.</div><div class="grid settings-grid"><section class="card"><div class="section-card-head"><h2>Document identity</h2><span class="badge">Control page</span></div><div class="field"><label>Manual title</label><input data-bind="title" value="${esc(data.title)}"></div><div class="field"><label>Issuing organisation</label><input data-bind="company" value="${esc(data.company)}"></div><div class="fields-two"><div class="field"><label>Document reference</label><input data-bind="documentCode" value="${esc(data.documentCode)}"></div><div class="field"><label>Revision number</label><input data-bind="revision" value="${esc(data.revision)}"></div></div><div class="field"><label>Effective date</label><input type="date" data-bind="effectiveDate" value="${esc(data.effectiveDate)}"></div></section><section class="card"><div class="section-card-head"><h2>Preparation and approval</h2></div><div class="field"><label>Prepared by / department</label><input data-bind="preparedBy" value="${esc(data.preparedBy)}"></div><div class="field"><label>Approved by</label><input data-bind="approvedBy" value="${esc(data.approvedBy)}"></div><div class="divider"></div><div class="muted-box"><b>Revision record</b><br>Revision ${esc(data.revision)} · ${esc(data.effectiveDate)}<br>Record the approved change summary in the section below before issuing a revision.</div><div class="field" style="margin-top:14px"><label>Revision summary</label><textarea data-bind="revisionSummary" placeholder="Summarise the changes covered by this revision.">${esc(data.revisionSummary||'')}</textarea></div></section></div>`;bindSettings();$('#controlPrint').onclick=()=>{renderDocument();window.print()}}
function pageForItem(x,i){return i+4}function renderToc(){let rows=allItems();$('#content').innerHTML=head('AUTOMATIC INDEX','Table of contents','Page references update automatically when pages are added or removed.',`<button class="btn" id="tocPrint">Preview / Print manual</button>`)+`<section class="card"><div class="section-card-head"><h2>Contents preview</h2><span class="subtle">${rows.length} section entries</span></div>${rows.length?`<table class="table"><thead><tr><th>Part</th><th>Section</th><th>Title</th><th>Manual page</th><th>Status</th></tr></thead><tbody>${rows.map((x,i)=>`<tr><td>Part ${esc(x.part)}</td><td>${esc(x.number||'—')}</td><td>${esc(x.title)}</td><td>${formatNum(x.part,x.number,pageForItem(x,i))}</td><td><span class="badge ${x.revised?'revised':''}">${x.revised?'Revised':'Current'}</span></td></tr>`).join('')}</tbody></table>`:`<div class="empty">The table of contents will populate as you add manual pages.</div>`}</section>`;$('#tocPrint').onclick=()=>{renderDocument();window.print()}}
function renderSettings(){let action='<button class="btn primary" id="settingsDone">Done</button>';$('#content').innerHTML=head('LAYOUT AND NUMBERING','Document settings','Choose automatic section and page-number formats, plus the footer text.')+`<div class="grid settings-grid"><section class="card"><div class="section-card-head"><h2>Automatic numbering</h2></div><div class="field"><label>Section number pattern</label><input data-bind="sectionTemplate" value="${esc(data.sectionTemplate||'1.{index}')}"><small>Tokens: {index}, {part}, {chapter}. Example: 1.{index}; new pages receive the next number.</small></div><div class="field"><label>Page number format</label><input data-bind="numberTemplate" value="${esc(data.numberTemplate)}"><small>Tokens: {part}, {chapter}, {page}. Example: OM-{part}-{chapter}.{page}</small></div><div class="field"><label>Footer format</label><input data-bind="footerTemplate" value="${esc(data.footerTemplate)}"><small>Tokens: {company}, {code}, {revision}, {page}, {date}, {title}</small></div><label class="toggle"><input type="checkbox" data-bind="showFooter" ${data.showFooter?'checked':''}> Show automatic footer on every printed page</label><div class="divider"></div><div class="muted-box"><b>Preview</b><br><span id="formatPreview">${esc(formatNum('A','1.1',4))} &nbsp; · &nbsp; ${esc(makeFooter(4))}</span></div></section><section class="card"><div class="section-card-head"><h2>Cover page preview</h2></div><div id="coverPreview">${coverPreview()}</div><div class="divider"></div><div class="muted-box">Printing uses A4 page size. The cover, control page and contents page are included automatically before the manual sections.</div></section><section class="card" style="grid-column:1/-1"><div class="section-card-head"><h2>Backup and restore</h2></div><div class="inline"><button class="btn primary" id="exportData">Export manual backup (.json)</button><button class="btn" id="importData">Import backup</button><button class="btn danger" id="resetData">Reset to sample manual</button></div><div class="subtle" style="margin-top:10px">The current version stores working data in this browser. Export a backup to move the manual to another device or browser.</div></section></div>`;bindSettings();$('#settingsDone').onclick=()=>setView('overview');$('#exportData').onclick=backup;$('#importData').onclick=()=>$('#fileInput').click();$('#resetData').onclick=()=>{if(confirm('Replace this manual with the original sample? Export a backup first if you want to keep your current changes.')){data=fresh();selectedItem=null;save();renderSettings();toast('Sample manual restored')}}}
function coverPreview(){return `<div class="cover-preview"><div class="cover-top"><div class="cover-kicker">${esc(data.company)}</div><h2>${esc(data.title)}</h2><p>${esc(data.documentCode)} · Revision ${esc(data.revision)}</p></div><div class="cover-bottom"><span>Effective ${esc(data.effectiveDate||'—')}</span><span>CONTROLLED DOCUMENT</span></div></div>`}
function formatNum(part,section,page){let tmpl=data.numberTemplate||'{part}-{chapter}.{page}';return tmpl.replaceAll('{part}',part||'A').replaceAll('{chapter}',section||'1').replaceAll('{page}',String(page))}function makeFooter(page,label=page){let t=data.footerTemplate||'{company} | {code} | Rev. {revision} | Page {page}';return t.replaceAll('{company}',data.company||'').replaceAll('{code}',data.documentCode||'').replaceAll('{revision}',data.revision||'00').replaceAll('{page}',String(label)).replaceAll('{date}',data.effectiveDate||'').replaceAll('{title}',data.title||'')}
function renderDocument(){let shell=$('#docShell'),items=allItems(),pages=[];pages.push(`<article class="paper cover"><div class="doc-title-label">${esc(data.company)}</div><div><div class="eyebrow">Controlled document</div><h1>${esc(data.title)}</h1><p style="font-size:15px;color:#526d87">${esc(data.documentCode)} · Revision ${esc(data.revision)}</p><p style="font-size:13px;color:#71849a;margin-top:15px">Effective date: ${esc(data.effectiveDate||'—')}</p></div><div class="doc-footer"><span>${esc(data.preparedBy||'')}</span><span>APPROVED BY ${esc(data.approvedBy||'')}</span></div></article>`);
pages.push(`<article class="paper control"><div class="eyebrow">Document governance</div><h2>Document Control</h2><table><tbody><tr><th>Document title</th><td>${esc(data.title)}</td></tr><tr><th>Document reference</th><td>${esc(data.documentCode)}</td></tr><tr><th>Organisation</th><td>${esc(data.company)}</td></tr><tr><th>Revision</th><td>${esc(data.revision)}</td></tr><tr><th>Effective date</th><td>${esc(data.effectiveDate||'—')}</td></tr><tr><th>Prepared by</th><td>${esc(data.preparedBy||'—')}</td></tr><tr><th>Approved by</th><td>${esc(data.approvedBy||'—')}</td></tr></tbody></table><h3>Revision record</h3><table><thead><tr><th>Revision</th><th>Date</th><th>Summary of changes</th></tr></thead><tbody><tr><td>${esc(data.revision)}</td><td>${esc(data.effectiveDate||'—')}</td><td>${esc(data.revisionSummary||'Initial issue / details to be entered')}</td></tr></tbody></table>${data.showFooter?`<div class="doc-footer"><span>${esc(data.documentCode)} · Rev. ${esc(data.revision)}</span><span>Page 2</span></div>`:''}</article>`);
pages.push(`<article class="paper"><div class="eyebrow">Document index</div><h2>Table of Contents</h2>${data.chapters.map(c=>`<h3>Part ${esc(c.part)} · ${esc(c.title)}</h3>${c.items.map(x=>{let p=items.indexOf(x)+4;return `<div class="toc-row"><span>${esc(x.number||'')}</span><span>${esc(x.title||'Untitled page')}</span><span class="leader"></span><em>${esc(formatNum(c.part,x.number,p))}</em></div>`}).join('')}`).join('')}${!items.length?'<div class="empty">No manual pages have been added.</div>':''}${data.showFooter?`<div class="doc-footer"><span>${esc(data.documentCode)} · Rev. ${esc(data.revision)}</span><span>Page 3</span></div>`:''}</article>`);
items.forEach((x,i)=>{let p=i+4,pno=formatNum(x.part,x.number,p);pages.push(`<article class="paper">${x.revised?'<div class="revbar"></div><div class="rev-note">Revised</div>':''}<div class="eyebrow">Part ${esc(x.part)} · ${esc(x.partTitle)}</div><h2>${esc(x.number?x.number+'  ·  ': '')}${esc(x.title)}</h2><div class="doc-body">${esc(x.body)}</div>${data.showFooter?`<div class="doc-footer"><span>${esc(makeFooter(p,pno))}</span><span>${esc(pno)}</span></div>`:''}</article>`)});shell.innerHTML=pages.join('');}
function backup(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(data.documentCode||'operations-manual').replace(/[^a-z0-9-_]/gi,'-')+'-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Manual backup downloaded')}
$('#fileInput').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result);if(!Array.isArray(v.chapters)||!v.title)throw Error();data=v;selectedItem=null;save();renderSettings();toast('Backup imported')}catch{toast('That file is not a valid manual backup')}e.target.value=''};r.readAsText(f)};
if(!Array.isArray(data.chapters)||data.chapters.length!==4)data=fresh();$('#sideDoc').textContent=data.title;$('#sideVersion').textContent=`Revision ${data.revision} · Draft`;render();
</script>
</body></html>
